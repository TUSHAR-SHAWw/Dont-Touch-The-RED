<?xml version="1.0" encoding="UTF-8"?>
<svg width="185" height="185" viewBox="0 0 185 185" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coinRareBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8ebf0"/>
      <stop offset="40%" stop-color="#b8c0cc"/>
      <stop offset="70%" stop-color="#8a94a3"/>
      <stop offset="100%" stop-color="#5a6570"/>
    </linearGradient>
    <linearGradient id="coinRareShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#d0d8e0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8a94a3" stop-opacity="0"/>
    </linearGradient>
    <filter id="coinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Thick arcade rim -->
  <circle cx="92.5" cy="92.5" r="88" fill="none" stroke="#2a2f36" stroke-width="8" filter="url(#coinShadow)"/>
  <!-- Main coin face -->
  <circle cx="92.5" cy="92.5" r="82" fill="url(#coinRareBody)" filter="url(#coinShadow)"/>
  <!-- Top shine stripe -->
  <ellipse cx="92.5" cy="55" rx="60" ry="18" fill="url(#coinRareShine)"/>
  <!-- Inner rim highlight -->
  <circle cx="92.5" cy="92.5" r="76" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>
  <!-- Pixel-art "3" -->
  <text x="92.5" y="108" text-anchor="middle" font-family="monospace, monospace" font-size="64" font-weight="900" fill="#1a1f26" font-variant-numeric="tabular-nums" paint-order="stroke fill" stroke="#ffffff" stroke-width="2">3</text>
  <!-- Bottom shadow arc -->
  <path d="M50 140 Q92.5 155 135 140" fill="none" stroke="#2a2f36" stroke-width="4" opacity="0.5"/>
  <!-- Star accent (rare indicator) -->
  <g fill="#ffffff" opacity="0.8">
    <polygon points="92.5,32 95.5,42 106,42 97.5,49 100,58 92.5,52 85,58 88,49 79,42 89.5,42"/>
  </g>
</svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg width="185" height="185" viewBox="0 0 185 185" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="magnetBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6bc5"/>
      <stop offset="45%" stop-color="#e83a9e"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b8256e"/>
    </linearGradient>
    <linearGradient id="magnetPole" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="magnetShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffeef8" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ff6bc5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ec3a9e" stop-opacity="0"/>
    </linearGradient>
    <filter id="magnetGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="magnetShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#4a051a" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Outer glow ring -->
  <circle cx="92.5" cy="92.5" r="92" fill="none" stroke="#ff6bc5" stroke-width="4" opacity="0.7" filter="url(#magnetGlow)"/>
  <!-- Thick arcade rim -->
  <circle cx="92.5" cy="92.5" r="88" fill="none" stroke="#4a051a" stroke-width="8" filter="url(#magnetShadow)"/>
  <!-- Main background -->
  <circle cx="92.5" cy="92.5" r="82" fill="#3a0414" filter="url(#magnetShadow)"/>
  <!-- Classic U-magnet shape - arcade style -->
  <path d="M48 38 
           L48 108 
           Q48 142 72 142 
           L113 142 
           Q137 142 137 108 
           L137 38 
           Q137 22 113 22 
           L72 22 
           Q48 22 48 38 
           Z" 
        fill="url(#magnetBody)" 
        stroke="#ff99d0" 
        stroke-width="4" 
        filter="url(#magnetShadow)"/>
  <!-- North pole (red) - classic N/S marking -->
  <rect x="50" y="22" width="22" height="28" rx="4" fill="#ff3366" filter="url(#magnetGlow)"/>
  <text x="61" y="43" text-anchor="middle" font-family="monospace" font-size="18" font-weight="900" fill="#ffffff" paint-order="stroke fill" stroke="#c00" stroke-width="1.5">N</text>
  <!-- South pole -->
  <rect x="113" y="22" width="22" height="28" rx="4" fill="#3b82f6" filter="url(#magnetGlow)"/>
  <text x="124" y="43" text-anchor="middle" font-family="monospace" font-size="18" font-weight="900" fill="#ffffff" paint-order="stroke fill" stroke="#0033aa" stroke-width="1.5">S</text>
  <!-- Magnetic field arcs - classic arcade style -->
  <g stroke="#ff99d0" stroke-width="3" opacity="0.8" stroke-linecap="round" filter="url(#magnetGlow)">
    <path d="M48 128 Q48 155 92.5 155 Q137 155 137 128"/>
    <path d="M48 118 Q48 148 92.5 148 Q137 148 137 118"/>
    <path d="M48 108 Q48 140 92.5 140 Q137 140 137 108"/>
  </g>
  <!-- Attraction particles -->
  <g fill="#ffeef8" filter="url(#magnetGlow)">
    <circle cx="92.5" cy="160" r="4"/>
    <circle cx="65" cy="155" r="2.5"/>
    <circle cx="120" cy="155" r="2.5"/>
    <circle cx="92.5" cy="170" r="3"/>
  </g>
  <!-- Thick arcade rim on magnet body -->
  <path d="M48 38 
           L48 108 
           Q48 142 72 142 
           L113 142 
           Q137 142 137 108 
           L137 38 
           Q137 22 113 22 
           L72 22 
           Q48 22 48 38 
           Z" 
        fill="none" 
        stroke="#ff99d0" 
        stroke-width="4" 
        opacity="0.7"/>
</svg>